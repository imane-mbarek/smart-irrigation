<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<title>Smart Irrigation</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: sans-serif; background: #0d1117; color: #e8f0e8; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
.box { background: #161c24; border: 1px solid #2a3a2a; border-radius: 16px; padding: 2rem; width: 480px; }
h1 { color: #4ade80; margin-bottom: 1.5rem; font-size: 1.5rem; }
.field { margin-bottom: 1rem; }
label { display: flex; justify-content: space-between; font-size: 0.85rem; color: #7a9a7a; margin-bottom: 0.4rem; }
.val { color: #4ade80; font-weight: 600; }
input[type=range] { width: 100%; accent-color: #4ade80; }
select { width: 100%; padding: 0.5rem; background: #0d1117; color: #e8f0e8; border: 1px solid #2a3a2a; border-radius: 8px; font-size: 0.9rem; }
button { width: 100%; margin-top: 1.5rem; padding: 0.9rem; background: #16a34a; color: white; border: none; border-radius: 10px; font-size: 1rem; cursor: pointer; }
button:hover { background: #4ade80; color: #0d1117; }
#result { margin-top: 1.5rem; padding: 1.2rem; border-radius: 10px; text-align: center; display: none; }
.irrigate { background: rgba(248,113,113,0.1); border: 1px solid #f87171; }
.no-irrigate { background: rgba(74,222,128,0.1); border: 1px solid #4ade80; }
.result-title { font-size: 1.2rem; font-weight: 700; margin-bottom: 0.5rem; }
.result-detail { font-size: 0.85rem; color: #7a9a7a; line-height: 2; }
.pump-on { color: #f87171; font-weight: 700; }
.pump-off { color: #4ade80; font-weight: 700; }
.section-title { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.1em; color: #7a9a7a; margin: 1.2rem 0 0.5rem; }
</style>
</head>
<body>
<div class="box">
  <h1>🌱 Smart Irrigation System</h1>

  <div class="section-title">Capteurs environnementaux</div>

  <div class="field">
    <label>Humidité sol <span class="val" id="sm-v">35%</span></label>
    <input type="range" min="0" max="100" value="35" oninput="document.getElementById('sm-v').textContent=this.value+'%'" id="soil_moisture">
  </div>

  <div class="field">
    <label>Température <span class="val" id="t-v">32°C</span></label>
    <input type="range" min="0" max="60" value="32" oninput="document.getElementById('t-v').textContent=this.value+'°C'" id="temperature">
  </div>

  <div class="field">
    <label>Humidité air <span class="val" id="h-v">45%</span></label>
    <input type="range" min="0" max="100" value="45" oninput="document.getElementById('h-v').textContent=this.value+'%'" id="humidity">
  </div>

  <div class="field">
    <label>Pluie <span class="val" id="r-v">2mm</span></label>
    <input type="range" min="0" max="100" value="2" oninput="document.getElementById('r-v').textContent=this.value+'mm'" id="rainfall">
  </div>

  <div class="section-title">Type de culture et sol</div>

  <div class="field">
    <label>Type de culture</label>
    <select id="crop_type">
      <option>Maize</option>
      <option>Sugarcane</option>
      <option>Cotton</option>
      <option>Tobacco</option>
      <option>Paddy</option>
      <option>Barley</option>
      <option>Wheat</option>
      <option>Millets</option>
      <option>Oil seeds</option>
      <option>Pulses</option>
      <option>Ground Nuts</option>
    </select>
  </div>

  <div class="field">
    <label>Type de sol</label>
    <select id="soil_type">
      <option>Sandy</option>
      <option>Loamy</option>
      <option>Black</option>
      <option>Red</option>
      <option>Clayey</option>
    </select>
  </div>

  <button onclick="predict()">Analyser les conditions</button>

  <div id="result">
    <div class="result-title" id="res-label"></div>
    <div class="result-detail" id="res-detail"></div>
  </div>
</div>

<script>
async function predict() {
  const payload = {
    soil_moisture : parseFloat(document.getElementById('soil_moisture').value),
    temperature   : parseFloat(document.getElementById('temperature').value),
    humidity      : parseFloat(document.getElementById('humidity').value),
    rainfall      : parseFloat(document.getElementById('rainfall').value),
    soil_type     : document.getElementById('soil_type').value,
    crop_type     : document.getElementById('crop_type').value,
  };

  try {
    const res  = await fetch('/predict', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(payload) });
    const data = await res.json();
    const r    = document.getElementById('result');
    const irrigate = data.irrigate === 1;

    r.style.display = 'block';
    r.className = irrigate ? 'irrigate' : 'no-irrigate';

    document.getElementById('res-label').innerHTML = irrigate
      ? '<span style="color:#f87171">💧 Irrigation Nécessaire</span>'
      : '<span style="color:#4ade80">✅ Pas d\'irrigation</span>';

    document.getElementById('res-detail').innerHTML = `
      Confiance : <b>${(data.probability * 100).toFixed(1)}%</b><br>
      Quantité eau : <b>${data.litres_eau} litres</b><br>
      Durée pompe : <b>${data.duree_pompe_min} minutes</b><br>
      Statut pompe : <b class="${irrigate ? 'pump-on' : 'pump-off'}">${data.statut_pompe}</b>
    `;
  } catch(e) {
    document.getElementById('result').style.display = 'block';
    document.getElementById('res-label').textContent = 'Erreur API';
  }
}
</script>
</body>
</html>
